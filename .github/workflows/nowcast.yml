name: Nowcasting Public

on:
  # Основно: външен будилник (cron-job.org) вика workflow_dispatch на 10 мин —
  # GitHub schedule-ът е ненадежден (12–13.10: 4–5 пуска на ден вместо 28).
  workflow_dispatch:
  schedule:
    # Резерв, ако външният будилник спре. :06/:16/… — малко след RO.
    - cron: '6-59/10 3-18 * * *'

# Пуск не започва, докато предишният не свърши (иначе push-овете се бият)
concurrency:
  group: nowcast
  cancel-in-progress: false

# Pages се публикува директно като артефакт (без commit на картинките —
# иначе repo-то расте с ~30 MB/ден). Settings → Pages → Source: GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgeos-dev libproj-dev libhdf5-dev libeccodes-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check GRIB support
        run: |
          python -c "import cfgrib, eccodes, xarray; print('eccodes', eccodes.codes_get_api_version(), '| cfgrib', cfgrib.__version__, '| xarray', xarray.__version__)"

      - name: Run nowcasting
        run: |
          python run_nowcast.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
